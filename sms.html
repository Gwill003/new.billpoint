
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exclusive Data Reward - 5GB at ₦99</title>
  <style>
    :root {
      --bg-yellow: #ffcc00;
      --bg-yellow-accent: #ffb700;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --primary-btn: #0f172a;
      --primary-btn-hover: #334155;
      --accent-green: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--bg-yellow), var(--bg-yellow-accent));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-dark);
      position: relative;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .gift-icon-wrapper {
      width: 72px;
      height: 72px;
      background: #fef3c7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 4px 12px rgba(234, 179, 8, 0.3);
    }

    .gift-icon {
      width: 40px;
      height: 40px;
      fill: #d97706;
    }

    .badge {
      display: inline-block;
      background-color: #fef3c7;
      color: #b45309;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 10px;
      color: var(--text-dark);
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 24px;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #475569;
    }

    input[type="tel"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="tel"]:focus {
      border-color: #d97706;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-btn);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn:hover {
      background-color: var(--primary-btn-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Status & Qualification Box */
    .status-box {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      text-align: center;
    }

    .status-box.active {
      display: block;
      animation: fadeIn 0.3s ease-in-out;
    }

    .status-box h3 {
      color: var(--accent-green);
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    .status-box p {
      font-size: 0.9rem;
      color: #166534;
      margin-bottom: 14px;
    }

    .btn-redirect {
      background-color: var(--accent-green);
      text-decoration: none;
      display: inline-block;
      width: 100%;
      padding: 12px;
      color: white;
      font-weight: 700;
      border-radius: 10px;
      transition: background 0.2s;
    }

    .btn-redirect:hover {
      background-color: #15803d;
    }

    /* Live Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 400px;
      z-index: 100;
    }

    .toast {
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 50px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .toast-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      flex-shrink: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

<body>

  <div class="container">
    <!-- Gift Visual -->
    <div class="gift-icon-wrapper">
      <svg class="gift-icon" viewBox="0 0 24 24">
        <path d="M20,6H16.41C16.8,5.42 17,4.74 17,4A3,3 0 0,0 14,1C13.26,1 12.58,1.2 12,1.59C11.42,1.2 10.74,1 10,1A3,3 0 0,0 7,4C7,4.74 7.2,5.42 7.59,6H4C2.89,6 2,6.89 2,8V11H22V8C22,6.89 21.1,6 20,6M10,3A1,1 0 0,1 11,4A1,1 0 0,1 10,5A1,1 0 0,1 9,4A1,1 0 0,1 10,3M14,3A1,1 0 0,1 15,4A1,1 0 0,1 14,5A1,1 0 0,1 13,4A1,1 0 0,1 14,3M2,13V19A2,2 0 0,0 4,21H11V13H2M13,13V21H20A2,2 0 0,0 22,19V13H13Z"/>
      </svg>
    </div>

    <span class="badge">Congratulations Old Users!</span>
    <h1>Did you know you can get 5GB Weekly Data for ₦99?</h1>
    <p class="subtitle">Don't dull! Hurry up now and claim your package before it expires.</p>

    <!-- Phone Verification Form -->
    <form id="qualifyForm" onsubmit="handleCheck(event)">
      <div class="form-group">
        <label for="phone">Enter Phone Number</label>
        <input type="tel" id="phone" placeholder="e.g. 08012345678" required pattern="[0-9]{11}" />
      </div>
      <button type="submit" id="submitBtn" class="btn">Check Eligibility</button>
    </form>

    <!-- Qualification Success Result -->
    <div id="statusBox" class="status-box">
      <h3>🎉 Wow, Congratulations!</h3>
      <p>Your line is eligible for the 5GB weekly package at ₦99.</p>
      <a href="https://new.billpoint.store/go.html" class="btn-redirect">Click Subscribe Now & Complete</a>
    </div>
  </div>

  <!-- Live Updating Activity Toast -->
  <div class="toast-container">
    <div class="toast" id="toastNotification">
      <span class="toast-dot"></span>
      <span id="toastText">Ikenna just got 15GB</span>
    </div>
  </div>

  <script>
    // Qualification Flow Script
    function handleCheck(event) {
      event.preventDefault();
      const phoneInput = document.getElementById('phone').value;
      const submitBtn = document.getElementById('submitBtn');
      const statusBox = document.getElementById('statusBox');

      if (phoneInput.length >= 10) {
        submitBtn.innerText = "Checking...";
        submitBtn.disabled = true;

        setTimeout(() => {
          submitBtn.style.display = "none";
          document.getElementById('phone').disabled = true;
          statusBox.classList.add('active');
        }, 1200);
      }
    }

    // Live Notification Updates (Rotates every 3 seconds)
    const updates = [
      "Ikenna just got 15GB",
      "Chiamaka got 5GB weekly data",
      "Adamu just bought 6GB now",
      "Blessing claimed 10GB bundle",
      "Emeka renewed 5GB data plan"
    ];

    let currentIndex = 0;
    const toastText = document.getElementById('toastText');
    const toastNotification = document.getElementById('toastNotification');

    setInterval(() => {
      // Fade out
      toastNotification.style.opacity = '0';
      toastNotification.style.transform = 'translateY(10px)';

      setTimeout(() => {
        currentIndex = (currentIndex + 1) % updates.length;
        toastText.innerText = updates[currentIndex];
        // Fade in
        toastNotification.style.opacity = '1';
        toastNotification.style.transform = 'translateY(0)';
      }, 300);
    }, 3000);
  </script>
