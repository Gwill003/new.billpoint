<body>
    <div class="survey-card text-center">
        <img src="https://www.etry.online/file/ad.jpg" alt="Aldi" class="img-fluid mb-3" style="border-radius:10px;">
        <div class="progress mb-3" style="height: 6px;">
            <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%; background-color: #ff6b05;">
            </div>
        </div>
        <!-- Question 1 -->
        <div id="step1" class="question-step">
            <div id="question-container"
                class="question-box d-flex align-items-center justify-content-center text-center active-question">
                <h5 id="question" class="m-0" style="display: block;">Do you purchase groceries at stores like Aldi?</h5>
            </div>
            <div id="answers" class="mt-4">
                <button leadgen-next="1" class="btn btn-brand w-100 mb-2" onclick="nextQuestion('yes')">Yes</button>
                <button class="btn btn-brand w-100 mb-2" onclick="nextQuestion('no')">No</button>
            </div>
        </div>

        <!-- Question 2 -->
        <div id="step2" class="question-step" style="display: none;">
            <div id="question-container"
                class="question-box d-flex align-items-center justify-content-center text-center active-question">
                <h5 id="question" class="m-0" style="display: block;">Have you shopped at Aldi in the past month?</h5>
            </div>
            <div id="answers" class="mt-4">
                <button leadgen-next="2" class="btn btn-brand w-100 mb-2" onclick="nextQuestion('yes')">Yes</button>
                <button class="btn btn-brand w-100 mb-2" onclick="nextQuestion('no')">No</button>
            </div>
        </div>

        <!-- Question 3 -->
        <div id="step3" class="question-step" style="display: none;">
            <div id="question-container"
                class="question-box d-flex align-items-center justify-content-center text-center active-question">
                <h5 id="question" class="m-0" style="display: block;">Would you recommend Aldi to a friend?</h5>
            </div>
            <div id="answers" class="mt-4">
                <button leadgen-next="3" class="btn btn-brand w-100 mb-2" onclick="nextQuestion('yes')">Yes</button>
                <button class="btn btn-brand w-100 mb-2" onclick="nextQuestion('no')">No</button>
            </div>
        </div>
        <div id="loader">
            <div class="spinner-border text-secondary mb-3"></div>
            <p>Processing your responses...</p>
        </div>
        <div id="final-message" style="display:none;">
            <h5 id="final-text"></h5>
            <button leadgen-submit class="btn btn-brand w-100 mb-2" id="next-btn" href="#">Continue</button>
            <!-- <button class="btn btn-brand w-100 mb-2"
                onclick="window.open(&#39;https://tk.mindsfact.com/click&#39;, &#39;_blank&#39;)">Continue</button> -->
        </div>
    </div>
    <script src="https://www.etry.online/file/questions.js.下载"></script>
    <script src="https://www.etry.online/file/oh.js.下载"></script>
    <script>
        const topic = 'grocery';
        const nx = '31';
        const progressStyle = 'bar';
        const questions = surveyQuestions[topic] || surveyQuestions['fallback'];
        let currentStep = 1;
        const totalSteps = 3;

        document.addEventListener('DOMContentLoaded', () => {
            // 显示第一个问题
            document.getElementById('step1').style.display = 'block';
            updateProgressBar();
        });

        function updateProgressBar() {
            if (progressStyle === 'bar') {
                document.getElementById('progressBar').style.width = ((currentStep - 1) / totalSteps) * 100 + '%';
            }
        }

        function nextQuestion(answer) {
            // 保存答案
            localStorage.setItem(`question${currentStep}`, answer);
            
            // 隐藏当前问题
            document.getElementById(`step${currentStep}`).style.display = 'none';
            
            if (currentStep < totalSteps) {
                // 显示下一个问题
                currentStep++;
                document.getElementById(`step${currentStep}`).style.display = 'block';
                updateProgressBar();
            } else {
                // 显示最终消息
                if (nx === '31') {
                    document.getElementById('loader').style.display = 'block';
                    setTimeout(() => {
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('final-message').style.display = 'block';
                        document.getElementById('final-text').innerHTML = `
                            <p class="reserved">Your gift card will be reserved for <span class="timer" id="countdown">8:00</span>.</p>
                            <h2>Congrats! 🎉</h2>
                            <p class="end">Based on your responses, you qualify for a $500 ${brandName} Gift Card.</p>
                            <p class="end">Click the button below to claim your gift card now.</p>
                            `;
                        startCountdown(480); // 8 minutes in seconds
                    }, 2000);
                } else {
                    document.getElementById('final-message').style.display = 'block';
                    document.getElementById('final-text').innerText = "Thank you!";
                }
                
                // 更新进度条到100%
                if (progressStyle === 'bar') {
                    document.getElementById('progressBar').style.width = '100%';
                }
            }
        }

        document.querySelectorAll('#next-btn').forEach(el => {
            el.addEventListener('click', () => {
                location.href = "https://www.blurparkskipper.courses/click?offer_id=38398&pub_id=247806&pub_click_id=ADD_CLICK_ID_HERE&site=PASS_SITE_HERE&pub_sub_id=PASS_PLACEMENT_HERE" + localStorage.getItem("search")
            })
        })
    </script>

</body>
